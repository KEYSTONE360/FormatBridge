[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S"]
# File-validation boundaries intentionally catch malformed third-party files;
# external tool invocations use argument arrays and validated executable paths.
ignore = ["S110", "S112", "S202", "S603", "S606"]
